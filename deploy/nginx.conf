# ============================================================================
# Nginx — psihologlilianajgheban.ro
#
# Instalare pe VPS:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/psihologlilianajgheban.ro
#   sudo ln -s /etc/nginx/sites-available/psihologlilianajgheban.ro \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificat SSL (după ce domeniul indică spre VPS):
#   sudo certbot --nginx -d psihologlilianajgheban.ro -d www.psihologlilianajgheban.ro
#
# Certbot rescrie automat blocurile de mai jos și adaugă redirectul spre HTTPS.
# ============================================================================

# Redirect www → fără www
server {
    listen 80;
    listen [::]:80;
    server_name www.psihologlilianajgheban.ro;
    return 301 https://psihologlilianajgheban.ro$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name psihologlilianajgheban.ro;

    # Certbot completează aici configurația SSL.

    # Dimensiune maximă a cererilor (formulare)
    client_max_body_size 2M;

    # Compresie
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Antete de securitate
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Fișierele statice generate de Next — hash în nume, deci cache lung
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Imagini optimizate
    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Restul aplicației
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
